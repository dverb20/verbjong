name: Deploy to GitHub Pages

# Builds the static app and publishes dist/ to the `gh-pages` branch.
# In repo Settings → Pages, set Source = "Deploy from a branch", Branch = gh-pages / root.
# This method works from any branch (no default-branch environment restriction),
# so you can test the feature branch without merging to main first.

on:
  push:
    branches: [claude/mahjong-web-app-tJXXa, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git branch -M gh-pages
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
